# Lines changed in /etc/valkey/valkey.conf (Valkey is the open-source Redis fork in Ubuntu's packages).
# Reachable only from the server itself, with a password; rooms and sessions survive a restart.
bind 127.0.0.1 -::1
protected-mode yes
port 6379
requirepass CHANGE_ME_LONG_RANDOM
# Rooms and sessions are never dropped silently: a full memory gives an error instead.
maxmemory 128mb
maxmemory-policy noeviction
# Every write goes to an append-only file, synced once a second.
appendonly yes
appendfsync everysec
